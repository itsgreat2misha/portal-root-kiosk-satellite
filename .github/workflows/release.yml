name: Release

# Tag-driven: pushing a tag like v0.9.0 builds every target's
# payload plus the model-independent APK set into ONE prebuilt
# bundle with a SHA-256 hash manifest, signs the manifest with the
# project release signing key (CI secret RELEASE_SIGNING_KEY_PEM_B64;
# the certificate is committed as release-signing-cert.pem and its
# fingerprint is pinned in tools/prebuilt_bundle.py), and publishes
# the bundle as a GitHub release. A provisioner run with --bundle
# verifies the manifest against the device's target and installs the
# artifacts in place of a local build, so a user needs only Python
# and adb. The tag must match PROVISIONER_VERSION in
# tools/provision_portal.py (with the leading "v"); a "-dev" version
# can never be released.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches PROVISIONER_VERSION
        run: |
          VERSION="$(grep -oP 'PROVISIONER_VERSION = "\K[^"]+' tools/provision_portal.py)"
          echo "PROVISIONER_VERSION=$VERSION, tag=${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match v${VERSION}" >&2
            exit 1
          fi
          case "$VERSION" in
            *-dev*) echo "refusing to release a -dev version" >&2; exit 1 ;;
          esac

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK (ANDROID_SDK_ROOT is
      # set); install the pinned components directly. The
      # setup-android action is not used: its internal sdkmanager
      # call for the legacy 'tools' package fails on current
      # cmdline-tools distributions.
      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;28.2.13676358" "build-tools;37.0.0" "platforms;android-36"

      # The bundle script builds through the provisioner's own
      # build(), so CI produces exactly what a local run produces:
      # every target, every optional component on. APKs are signed
      # with the committed project debug keystore (the build
      # enforces its fingerprint), so bundle APKs install as updates
      # on devices provisioned from source.
      - name: Build and sign the prebuilt bundle
        env:
          RELEASE_SIGNING_KEY_PEM_B64: ${{ secrets.RELEASE_SIGNING_KEY_PEM_B64 }}
        run: |
          if [ -z "${RELEASE_SIGNING_KEY_PEM_B64}" ]; then
            echo "RELEASE_SIGNING_KEY_PEM_B64 secret is not set" >&2
            exit 1
          fi
          KEY_FILE="${RUNNER_TEMP}/release-signing-key.pem"
          printf '%s' "${RELEASE_SIGNING_KEY_PEM_B64}" | base64 -d > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          python3 tools/build_release_bundle.py \
            --output dist --sign-key "${KEY_FILE}" --tarball
          rm -f "${KEY_FILE}"
          (cd dist && sha256sum portal-provisioner-bundle-*.tar.gz > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/portal-provisioner-bundle-*.tar.gz dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
