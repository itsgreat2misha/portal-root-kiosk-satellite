name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Phase F: the suite runs on all three supported host OSes. The
    # prebuilt bundle is the primary user path on Windows and macOS
    # hosts, so a Linux-only signal is not evidence it works there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite is hermetic by contract: it must pass with no adb
      # binary present. GitHub's Linux/macOS runners ship none, so
      # those legs are the guard against tests leaking to a real
      # device tool. The Windows image ships an Android SDK, so the
      # guard is not asserted there; the suite's device addresses
      # are TEST-NET and unroutable either way.
      - name: Confirm adb is absent (hermetic-suite guard)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v adb; then
            echo "adb unexpectedly present; the hermetic check would be meaningless" >&2
            exit 1
          fi
      - name: Run unit tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      # DIAGNOSTIC (temporary, not for merge): per-group steps on
      # Windows so the failing modules are visible from job results.
      - name: Win tests group 1
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_adbkey_rotation tests.test_autoroot_failure_budget tests.test_autoroot_flows tests.test_autoroot_guard
      - name: Win tests group 2
        if: always() && runner.os == 'Windows'
        run: python -m unittest tests.test_autoroot_orphan_sweep tests.test_autoroot_watchdog tests.test_boot_flush_guard tests.test_c3a_drift_pass
      - name: Win tests group 3
        if: always() && runner.os == 'Windows'
        run: python -m unittest tests.test_collect_diagnostics tests.test_cross_platform tests.test_deferred_failures tests.test_device_session
      - name: Win tests group 4
        if: always() && runner.os == 'Windows'
        run: python -m unittest tests.test_fast_paths tests.test_flag_consolidation tests.test_m0_characterization
      - name: Win tests group 5
        if: always() && runner.os == 'Windows'
        run: python -m unittest tests.test_mha_tuning tests.test_ota_nodemon tests.test_portal_targets tests.test_prebuilt_bundle
      - name: Win tests group 6
        if: always() && runner.os == 'Windows'
        run: python -m unittest tests.test_provision_portal_cli tests.test_watch_result_evidence tests.test_wifi_flush_guard
      - name: Byte-compile all Python sources
        run: python -m compileall -q tools tests
